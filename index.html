<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작품 세계관 메인 페이지</title>
  <style>
    /* 기본 스타일 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth; /* 사이드바 클릭 시 부드러운 스크롤 */
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    /* 우측 사이드바 스타일 */
    .sidebar {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 10px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
    .sidebar a {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .sidebar a:hover {
      color: #fff;
    }

    /* 섹션 공통 스타일 */
    section {
      min-height: 100vh;
      padding: 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #333;
    }

    /* 메인 인터랙션 영역 */
    .interactive-container {
      text-align: center;
      cursor: pointer;
      margin-bottom: 50px;
    }
    .interactive-container img {
      max-width: 80%;
      max-height: 70vh;
      border-radius: 10px;
      transition: opacity 0.5s ease;
    }
    .hidden {
      display: none;
    }

    /* 타이틀 및 표지 영역 */
    .title-cover-section {
      text-align: center;
      margin-top: 40px;
    }
    .cover-image {
      max-width: 400px;
      width: 100%;
      border-radius: 8px;
      margin-top: 20px;
    }

    /* 콘텐츠 섹션 스타일 */
    .content-box {
      max-width: 800px;
      width: 100%;
      line-height: 1.8;
    }
    h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #e5a93b;
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <a href="#main-section">메인</a>
    <a href="#about">작품소개</a>
    <a href="#worldview">세계관</a>
    <a href="#characters">캐릭터</a>
    <a href="#play">플레이설명</a>
  </nav>

  <section id="main-section">
    <div class="interactive-container" id="imgContainer">
      <img id="img1" src="https://github.com/user-attachments/assets/03b27c21-a245-42b5-acb0-44c4406a3414" alt="이미지 1 (클릭하세요)">
      <img id="img2" class="hidden" src="https://github.com/user-attachments/assets/6f0e0a87-30b8-45ef-9124-87e0cb0dafdf" alt="이미지 2">
    </div>

    <div class="title-cover-section">
      <h1>희망빌라 누리집</h1>
      <p>와정 말 정 겹 다!.</p>
      <p>를 공지 읽으 시 오.</p>
      <img class="cover-image" src="https://via.placeholder.com/400x600?text=Cover+Image" alt="표지 이미지">
    </div>
  </section>

  <section id="about">
    <div class="content-box">
      <h2></h2>
      <p>"본 작품의 배경 지명은 실제를 바탕으로 하였으나, 등장 인물과 사건은 모두 창작된 픽션입니다."</p>
    </div>
  </section>

  <section id="worldview">
    <div class="content-box">
      <h2>세계관</h2>
      <p>세계관의 배경, 주요 역사, 세력 구조 등을 설명합니다.</p>
    </div>
  </section>

  <section id="characters">
    <div class="content-box">
      <h2>캐릭터 소개</h2>
      <p>등장인물들의 프로필, 이미지, 세부 설정을 배치합니다.</p>
    </div>
  </section>

  <section id="play">
    <div class="content-box">
      <h2>플레이 설명</h2>
      <p>게임 규칙, 진행 방식, 컨트롤 방법 등을 안내합니다.</p>
    </div>
  </section>

  <script>
    const imgContainer = document.getElementById('imgContainer');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');

    // 이미지 1 클릭 시 이미지 2로 전환하는 기능
    imgContainer.addEventListener('click', function() {
      if (!img1.https://github.com/user-attachments/assets/1c1966c8-c045-42b0-b18d-f888856df5f6('hidden')) {
        img1.https://github.com/user-attachments/assets/e96a4824-1f84-4d2a-9e85-b6046e299465('hidden');
        img2.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
